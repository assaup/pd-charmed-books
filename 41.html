  <!-- Прелоадер -->

    <div class="lds-ring"><div></div><div></div><div></div><div></div></div>

  <main>

    <!-- ================================================================
         ТЕКСТ СТРАНИЦЫ — единственное место, куда переносится текст.
         Один <p> = один абзац. Заголовок — <h1>. Подзаголовок —
         <div class="content-item"><h3>…</h3></div>. Дублировать для
         мобильных НЕ нужно: раскладка перестраивается в main.css.
         ================================================================ -->
    <section id="content">
      <div id="textbox">
        <p>Экран 41</p>
        <div class="content-item">
          <p>174. Дэвид отвозит её к матери. Там происходит скандал. Мать отказывается признавать существование Майка и помогать в его поисках, обвиняя его в эгоизме.</p>
        </div>
      </div>
    </section>

    <!-- ================================================================
         СЦЕНА — цельная иллюстрация + три слоя света:
         вспышки ярости за матерью, давящий контурный свет вокруг Даяны
         и силуэт отца, который то проступает, то тает.
         Вся анимация — CSS-keyframes в 41.css, page41.js только запускает её.
         ================================================================ -->
    <div id="scene">
      <div id="overflow-wrapper">
        <img class="scene__img" id="bg" src="./assets/img/page-41/bg.jpg" alt="Даяна держится за голову, мать кричит на неё, позади силуэт мужчины">

        <!-- Силуэт отца тает: поверх него «туман» цвета фона -->
        <div id="father-fog" aria-hidden="true"></div>

        <!-- Вспышки ярости за матерью -->
        <div id="rage" aria-hidden="true"></div>

        <!-- Голубой свет вокруг Даяны -->
        <div id="pressure" aria-hidden="true"></div>
      </div>
    </div>

  </main>
